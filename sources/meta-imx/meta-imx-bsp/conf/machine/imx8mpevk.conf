#@TYPE: Machine
#@NAME: i.MX 8MP Consolidated Machine
#@DESCRIPTION: A consolidated machine configuration for i.MX 8MP EVK both LPDDR4 and DDR4, see Important Note below
#@MAINTAINER: Jun Zhu <junzhu@nxp.com>

#        ** Important Note **
# This machine generates an image contain the bootloader of LPDDR4 EVK, Kernel, and rootfs, plus the DTBs of
# both LPDDR4 and DDR4 EVKs. The resulting image can be used for LPDDR4 EVK directly, and it can
# be manually converted for DDR4 EVK following the instructions in the User Guide - Consolidated Machines section.
# For users of both EVK variants, this can save build time and space. For most users, the dedicated machines
# imx8mp-lpddr4-evk.conf and imx8mp-ddr4-evk.conf should be used for simplicity.

MACHINEOVERRIDES =. "imx8mp-lpddr4-evk:"
require conf/machine/imx8mp-lpddr4-evk.conf

## John_gao add Debix Dtb 
KERNEL_DEVICETREE += " \
    freescale/imx8mp-evk.dtb \
    freescale/imx8mp-debix-4g-board.dtb \
    freescale/imx8mp-debix-core-ar1335.dtb \
    freescale/imx8mp-debix-core-board.dtb \
    freescale/imx8mp-debix-core-gc2145.dtb \
    freescale/imx8mp-debix-core-ov5640.dtb \
    freescale/imx8mp-debix-core-TD050A.dtb \
    freescale/imx8mp-debix-core-TD070A.dtb \
    freescale/imx8mp-debix-core-TD080A.dtb \
    freescale/imx8mp-debix-core-TD080B.dtb \
    freescale/imx8mp-debix-core-TD101A.dtb \
    freescale/imx8mp-debix-io-board.dtb \
    freescale/imx8mp-debix-io-raspberrypi-touchscreen.dtb \
    freescale/imx8mp-debix-io-TD050A.dtb \
    freescale/imx8mp-debix-io-TD070A.dtb \
    freescale/imx8mp-debix-io-TD080A.dtb \
    freescale/imx8mp-debix-io-TD080B.dtb \
    freescale/imx8mp-debix-io-TD101A.dtb \
    freescale/imx8mp-debix-lora-board.dtb \
    freescale/imx8mp-debix-lora-TD050A.dtb \
    freescale/imx8mp-debix-lora-TD070A.dtb \
    freescale/imx8mp-debix-lora-TD080A.dtb \
    freescale/imx8mp-debix-lora-TD080B.dtb \
    freescale/imx8mp-debix-lora-TD101A.dtb \
"

