# V9.0 — PREEMPT_RT enabled (full preemptible kernel for hard RT audio)
# Patch series : patch-6.6.36-rt35 from kernel.org
# Goal : reduce scheduling jitter max from ~1.2 ms to ~150 µs
#
# Replaces CONFIG_PREEMPT=y (low-latency desktop) with full RT preemption.
# Spinlocks become rt_mutex equivalents, IRQs run in threads (schedulable),
# softirqs are forced threaded.

CONFIG_PREEMPT_RT=y

# These are forced off by PREEMPT_RT (it replaces them with rt equivalents).
# CONFIG_PREEMPT is not set
# CONFIG_PREEMPT_VOLUNTARY is not set
# CONFIG_PREEMPT_NONE is not set
# CONFIG_PREEMPT_DYNAMIC is not set

# High-res timers and full no-HZ (we already use this in cmdline)
CONFIG_HIGH_RES_TIMERS=y
CONFIG_NO_HZ_FULL=y

# Threaded IRQs default (also need `threadirqs` cmdline)
CONFIG_IRQ_FORCED_THREADING_DEFAULT=y

# Lockdep + debug RT options disabled in production for performance
# (enable temporarily during validation if hunting RT issues)
# CONFIG_DEBUG_RT_MUTEXES is not set
# CONFIG_PROVE_LOCKING is not set
