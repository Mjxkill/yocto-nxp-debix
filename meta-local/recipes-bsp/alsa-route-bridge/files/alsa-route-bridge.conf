# V7.0-E6.c — Configuration déclarative du routing ALSA N×M
#
# Une ligne par route : nom|capture_pcm|playback_pcm|channels|rate|format|extra_alsaloop_opts
# Format = paramètre format ALSA (S16_LE, S32_LE, etc.)
# extra_alsaloop_opts : args supplémentaires (-S sync, -t buffer_us, --thread, etc.)
#
# Le script alsa-route-start.sh fork un alsaloop par ligne en background.
# Édit + `systemctl restart alsa-route-bridge.service` pour appliquer.
#
# Par défaut commenté : pas de route active au boot (le DSP loopback-c-lowlat
# en mode dev est plus pratique). Le GUI E7 ou l'utilisateur dé-commente les
# routes désirées et active le service.

# DSP TAC5212 cap (8 ch mic) -> UAC2 play (vers PC host)
# dsp_to_uac2|hw:softac5212tdm,0|hw:UAC2Gadget,0|8|48000|S32_LE|-S 0 -t 8000

# UAC2 cap (depuis PC host) -> DSP TAC5212 play (vers speakers)
# uac2_to_dsp|hw:UAC2Gadget,0|hw:softac5212tdm,0|8|48000|S32_LE|-S 0 -t 8000

# Phone cap (2 ch) -> DSP TAC5212 play (downmix 2->8 par plug auto)
# phone_to_dsp|hw:Phone,1|plughw:softac5212tdm,0|2|48000|S16_LE|-S 0 -t 8000

# DSP cap (mics, downmix 8->2 par plug auto) -> Phone play
# dsp_to_phone|plughw:softac5212tdm,0|hw:Phone,0|2|48000|S16_LE|-S 0 -t 8000
